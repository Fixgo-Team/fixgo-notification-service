services:
  mysql:
    image: mysql:8.4
    container_name: fixgo-notification-mysql
    environment:
      MYSQL_DATABASE: notification_db
      MYSQL_USER: fixgo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fixgo_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_local}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
